[project]
name = "workflows"
version = "0.11.3"
description = "Data & AI Unit centralised CI/CD workflows"
authors = [{ name = "Cai Davis", email = "Cai.Davis@uhs.nhs.uk" }]
license = "CC-BY-NC-4.0"
readme = "README.md"
requires-python = ">=3.10,<4"

# Dependencies
dependencies = [


]

# Development
[dependency-groups]
dev = [
  "pytest>=9.0.1,<10.0.0",
  "pytest-cov>=7.0.0,<8.0.0",
  "commitizen>=4.1.1,<5.0.0",
  "mypy>=1.18.2,<2.0.0",
  "ipykernel (>=7.1.0,<8.0.0)",
  "pre-commit>=4.4.0,<5.0.0",
]

# UV Private Source
[[tool.uv.index]]
name = "rds"
url = "https://pypi.rds.uhs.nhs.uk/"
explicit = true

[tool.uv.sources]


[tool.uv]
native-tls = true

# Build System
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/workflows",
]

[tool.hatch.build.targets.wheel]
include = [
    "src/workflows",
]

[tool.hatch.build.targets.wheel.sources]
"src/workflows" = "workflows"

[tool.poetry]
packages = [
  { include = "workflows", from = "src" },
]

# Poetry Private Source
[[tool.poetry.source]]
name = "rds"
url = "https://pypi.rds.uhs.nhs.uk/"
priority = "supplemental"

# Commitizen
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$major.$minor.$patch$prerelease"
version_type = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
