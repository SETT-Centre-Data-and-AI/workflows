name: Ensure Private Release PR Comes From Main

# =================================================================== #
# Ensure Private Release PR Comes From Main
# Ensures that PRs into the private release branch
# can only come from the private main branch.
# =================================================================== #

on:
  workflow_call: {}

jobs:
  env-config:
    uses: ./.github/workflows/config.yaml

  ensure-release-from-main:
    needs: env-config
    if: >
      github.repository == needs.env-config.outputs.PRIVATE_REPO &&
      github.base_ref == needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PRIVATE_REPO: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      PRIVATE_REPO_MAIN_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      PRIVATE_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}

    steps:
    - name: Show PR Context
      run: |
        echo "Repo:          $GITHUB_REPOSITORY"
        echo "Base branch:   ${{ github.base_ref }}"
        echo "Head branch:   ${{ github.head_ref }}"
        echo "Private repo:  $PRIVATE_REPO"
        echo "Main branch:   $PRIVATE_REPO_MAIN_BRANCH"
        echo "Release branch:$PRIVATE_REPO_RELEASE_BRANCH"

    - name: Ensure PR into private release comes from private main
      run: |
        if [ "${{ github.head_ref }}" != "$PRIVATE_REPO_MAIN_BRANCH" ]; then
          echo "❌ ERROR: PRs into '$PRIVATE_REPO_RELEASE_BRANCH' must come from '$PRIVATE_REPO_MAIN_BRANCH'."
          echo "Actual source branch: '${{ github.head_ref }}'"
          exit 1
        fi

        echo "✅ PR into '$PRIVATE_REPO_RELEASE_BRANCH' comes from '$PRIVATE_REPO_MAIN_BRANCH'."
