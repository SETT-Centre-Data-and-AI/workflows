name: Workflow Orchestrator

# =================================================================== #
# Workflow Orchestrator
# Central place to route events and dispatch downstream reusable workflows.
# =================================================================== #

on:
  workflow_call:
    inputs:
      event-name:
        required: false
        type: string
      event-action:
        required: false
        type: string
      base-ref:
        required: false
        type: string
      head-ref:
        required: false
        type: string
      ref-name:
        required: false
        type: string
      repository:
        required: false
        type: string
      pr-merged:
        required: false
        type: boolean
  pull_request:
    branches: ['**']
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  env-config:
    uses: ./.github/workflows/config.yaml

  route:
    needs: env-config
    runs-on: ubuntu-latest
    outputs:
      RUN_BUILD_AND_TEST: ${{ steps.route.outputs.RUN_BUILD_AND_TEST }}
      RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN: ${{ steps.route.outputs.RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN }}
      RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING: ${{ steps.route.outputs.RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING }}
      RUN_PRE_RELEASE_VERSION_CHECK: ${{ steps.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK }}
      RUN_BACK_SYNC: ${{ steps.route.outputs.RUN_BACK_SYNC }}
      RUN_SYNC_TO_PUBLIC: ${{ steps.route.outputs.RUN_SYNC_TO_PUBLIC }}
      RUN_PUBLISH_TO_PYPI: ${{ steps.route.outputs.RUN_PUBLISH_TO_PYPI }}

    defaults:
      run:
        shell: bash

    env:
      PRIVATE_REPO: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      PRIVATE_REPO_MAIN_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      PRIVATE_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
      PUBLIC_REPO: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      PUBLIC_REPO_INCOMING_BRANCH: ${{ needs.env-config.outputs.PUBLIC_REPO_INCOMING_BRANCH }}
      CALLER_EVENT_NAME: ${{ inputs.event-name }}
      CALLER_EVENT_ACTION: ${{ inputs.event-action }}
      CALLER_BASE_REF: ${{ inputs.base-ref }}
      CALLER_HEAD_REF: ${{ inputs.head-ref }}
      CALLER_REF_NAME: ${{ inputs.ref-name }}
      CALLER_REPOSITORY: ${{ inputs.repository }}
      CALLER_PR_MERGED: ${{ inputs.pr-merged }}
      CTX_EVENT_ACTION: ${{ github.event.action || '' }}
      CTX_BASE_REF: ${{ github.base_ref || '' }}
      CTX_HEAD_REF: ${{ github.head_ref || '' }}
      CTX_REF_NAME: ${{ github.ref_name || '' }}
      CTX_PR_MERGED: ${{ github.event.pull_request.merged || false }}

    steps:
    - name: Show Event Context
      run: |
        EVENT_NAME="${CALLER_EVENT_NAME:-$GITHUB_EVENT_NAME}"
        EVENT_ACTION="${CALLER_EVENT_ACTION:-$CTX_EVENT_ACTION}"
        BASE_REF="${CALLER_BASE_REF:-$CTX_BASE_REF}"
        HEAD_REF="${CALLER_HEAD_REF:-$CTX_HEAD_REF}"
        REF_NAME="${CALLER_REF_NAME:-$CTX_REF_NAME}"
        REPOSITORY_NAME="${CALLER_REPOSITORY:-$GITHUB_REPOSITORY}"
        PR_MERGED="${CALLER_PR_MERGED:-$CTX_PR_MERGED}"

        echo "Repo:        $GITHUB_REPOSITORY"
        echo "Event:       $GITHUB_EVENT_NAME"
        echo "Action:      ${{ github.event.action || 'n/a' }}"
        echo "Ref:         $GITHUB_REF"
        echo "Ref name:    $GITHUB_REF_NAME"
        echo "Base ref:    ${{ github.base_ref || 'n/a' }}"
        echo "Head ref:    ${{ github.head_ref || 'n/a' }}"
        echo "Effective repo:      $REPOSITORY_NAME"
        echo "Effective event:     $EVENT_NAME"
        echo "Effective action:    ${EVENT_ACTION:-n/a}"
        echo "Effective base ref:  ${BASE_REF:-n/a}"
        echo "Effective head ref:  ${HEAD_REF:-n/a}"
        echo "Effective ref name:  ${REF_NAME:-n/a}"
        echo "Effective merged:    ${PR_MERGED:-false}"

    - name: Compute Routed Workflows
      id: route
      run: |
        EVENT_NAME="${CALLER_EVENT_NAME:-$GITHUB_EVENT_NAME}"
        EVENT_ACTION="${CALLER_EVENT_ACTION:-$CTX_EVENT_ACTION}"
        BASE_REF="${CALLER_BASE_REF:-$CTX_BASE_REF}"
        HEAD_REF="${CALLER_HEAD_REF:-$CTX_HEAD_REF}"
        REF_NAME="${CALLER_REF_NAME:-$CTX_REF_NAME}"
        REPOSITORY_NAME="${CALLER_REPOSITORY:-$GITHUB_REPOSITORY}"
        PR_MERGED="${CALLER_PR_MERGED:-$CTX_PR_MERGED}"

        RUN_BUILD_AND_TEST=false
        RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN=false
        RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING=false
        RUN_PRE_RELEASE_VERSION_CHECK=false
        RUN_BACK_SYNC=false
        RUN_SYNC_TO_PUBLIC=false
        RUN_PUBLISH_TO_PYPI=false

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$REF_NAME" = "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
            RUN_BACK_SYNC=true
            RUN_SYNC_TO_PUBLIC=true
          fi
          if [ "$REPOSITORY_NAME" = "$PUBLIC_REPO" ] && [ "$REF_NAME" = "$PUBLIC_REPO_RELEASE_BRANCH" ]; then
            RUN_PUBLISH_TO_PYPI=true
          fi
        fi

        if [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$BASE_REF" = "$PRIVATE_REPO_MAIN_BRANCH" ]; then
            if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]; then
              RUN_BUILD_AND_TEST=true
            fi
          fi

          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$BASE_REF" = "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
            if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]; then
              RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN=true
              RUN_PRE_RELEASE_VERSION_CHECK=true
            fi

            if [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ] && [ "$HEAD_REF" = "$PRIVATE_REPO_MAIN_BRANCH" ]; then
              RUN_BACK_SYNC=true
              RUN_SYNC_TO_PUBLIC=true
            fi
          fi

          if [ "$REPOSITORY_NAME" = "$PUBLIC_REPO" ] && [ "$BASE_REF" = "$PUBLIC_REPO_RELEASE_BRANCH" ]; then
            if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]; then
              RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING=true
              RUN_PRE_RELEASE_VERSION_CHECK=true
            fi

            if [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ] && [ "$HEAD_REF" = "$PUBLIC_REPO_INCOMING_BRANCH" ]; then
              RUN_PUBLISH_TO_PYPI=true
            fi
          fi
        fi

        echo "RUN_BUILD_AND_TEST=$RUN_BUILD_AND_TEST" >> "$GITHUB_OUTPUT"
        echo "RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN=$RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN" >> "$GITHUB_OUTPUT"
        echo "RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING=$RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING" >> "$GITHUB_OUTPUT"
        echo "RUN_PRE_RELEASE_VERSION_CHECK=$RUN_PRE_RELEASE_VERSION_CHECK" >> "$GITHUB_OUTPUT"
        echo "RUN_BACK_SYNC=$RUN_BACK_SYNC" >> "$GITHUB_OUTPUT"
        echo "RUN_SYNC_TO_PUBLIC=$RUN_SYNC_TO_PUBLIC" >> "$GITHUB_OUTPUT"
        echo "RUN_PUBLISH_TO_PYPI=$RUN_PUBLISH_TO_PYPI" >> "$GITHUB_OUTPUT"

    - name: Show Routed Workflow Map
      run: |
        echo "Routed workflows for this event:"
        echo "  build-and-test:                       ${{ steps.route.outputs.RUN_BUILD_AND_TEST }}"
        echo "  ensure-private-release-from-main:     ${{ steps.route.outputs.RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN }}"
        echo "  ensure-public-release-from-incoming:  ${{ steps.route.outputs.RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING }}"
        echo "  pre-release-version-check:            ${{ steps.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK }}"
        echo "  back-sync-release-to-main:            ${{ steps.route.outputs.RUN_BACK_SYNC }}"
        echo "  sync-to-public:                       ${{ steps.route.outputs.RUN_SYNC_TO_PUBLIC }}"
        echo "  publish-to-pypi:                      ${{ steps.route.outputs.RUN_PUBLISH_TO_PYPI }}"

  run-build-and-test:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_BUILD_AND_TEST == 'true'
    uses: ./.github/workflows/build-and-test.yaml

  run-ensure-private-release-from-main:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_ENSURE_PRIVATE_RELEASE_FROM_MAIN == 'true'
    uses: ./.github/workflows/ensure-private-release-from-main.yaml

  run-ensure-public-release-from-incoming:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_ENSURE_PUBLIC_RELEASE_FROM_INCOMING == 'true'
    uses: ./.github/workflows/ensure-public-release-from-incoming.yaml

  run-pre-release-version-check:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK == 'true'
    uses: ./.github/workflows/pre-release-version-check.yaml

  run-back-sync-release-to-main:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_BACK_SYNC == 'true'
    uses: ./.github/workflows/back-sync-release-to-main.yaml
    secrets: inherit

  run-sync-to-public:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_SYNC_TO_PUBLIC == 'true'
    uses: ./.github/workflows/sync-to-public.yaml
    secrets: inherit

  run-publish-to-pypi:
    needs: [env-config, route]
    if: needs.route.outputs.RUN_PUBLISH_TO_PYPI == 'true'
    uses: ./.github/workflows/publish-to-pypi.yaml
    secrets: inherit
