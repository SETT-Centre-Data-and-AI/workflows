name: Publish to PyPI

# ================================================================= #
# Publish to PyPI
# Publishes from PUBLIC repo manually or when PR to release is closed
# ================================================================= #

on:
  workflow_call:
    inputs:
      package-name:
        required: false
        type: string
      package-slug:
        required: false
        type: string
      public-repo:
        required: false
        type: string
      public-repo-release-branch:
        required: false
        type: string
      publish-python-version:
        required: false
        type: string
      publish-on-release:
        required: false
        type: string
  workflow_dispatch: {}

jobs:
  publish-to-pypi:
    name: Build and Publish
    if: > # in public repo, and called by orchestrator or run manually on release
      github.repository == (inputs.public-repo || 'SETT-Centre-Data-and-AI/workflows') &&
      (
        github.event_name != 'workflow_dispatch' ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == (inputs.public-repo-release-branch || 'release'))
      ) &&
      (inputs.publish-on-release || 'true') == 'true'

    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: pypi

    env:
      # From shared config
      PACKAGE_NAME: ${{ inputs.package-name }}
      PACKAGE_SLUG: ${{ inputs.package-slug }}
      PUBLIC_REPO: ${{ inputs.public-repo || 'SETT-Centre-Data-and-AI/workflows' }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ inputs.public-repo-release-branch || 'release' }}
      # Publish config
      PYTHON_VERSION: ${{ inputs.publish-python-version || '3.13' }}
      PYPI_USERNAME: __token__

    steps:
    - name: Show Publish Context
      run: |
        echo "Repo:        $GITHUB_REPOSITORY"
        echo "Branch:      $GITHUB_REF_NAME"
        echo "Event:       $GITHUB_EVENT_NAME"

    - name: Verify PyPI token exists
      env:
        TOKEN: ${{ secrets.PYPI_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "❌ ERROR: PYPI_TOKEN is missing or empty in repo secrets."
          echo "Please set PYPI_TOKEN in the PUBLIC repository:"
          echo "  Settings → Secrets and variables → Actions → PYPI_TOKEN"
          exit 1
        else
          echo "✅ PYPI_TOKEN is present"
        fi

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade build twine

    - name: Validate package inputs
      run: |
        if [ -z "$PACKAGE_NAME" ] || [ -z "$PACKAGE_SLUG" ]; then
          echo "ERROR: package-name and package-slug must be provided in ci-orchestrator workflow inputs."
          exit 1
        fi

    - name: Build Distributions
      run: python -m build

    - name: Validate Distributions
      run: python -m twine check dist/*

    - name: Install Wheel & Smoke Test
      run: |
        python -m pip install dist/*.whl
        python -m pip show "$PACKAGE_SLUG" > /dev/null
        python - << 'PY'
        import importlib
        pkg = "${{ env.PACKAGE_NAME }}"
        m = importlib.import_module(pkg)
        print(f"{pkg} OK, version:", getattr(m, "__version__", "unknown"))
        PY

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: ${{ env.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: python -m twine upload dist/*
