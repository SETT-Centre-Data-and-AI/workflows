name: Sync to Public

# =============================================================== #
# Sync to Public Repo
# Runs in PRIVATE repo manually or when PR to release branch is merged
# =============================================================== #

on:
  workflow_call:
    inputs:
      private-repo:
        required: false
        type: string
      private-repo-release-branch:
        required: false
        type: string
      public-repo:
        required: false
        type: string
      public-repo-release-branch:
        required: false
        type: string
      public-repo-incoming-branch:
        required: false
        type: string
  workflow_dispatch: {}

jobs:
  sync-to-public:
    name: Sync Public
    if: > # in private repo, and PR merged or run manually
      github.repository == (inputs.private-repo || github.repository) &&
      (
        github.event_name != 'workflow_dispatch' ||
        (github.event_name == 'workflow_dispatch' &&
         github.ref_name == (inputs.private-repo-release-branch || 'release'))
      )
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      # From shared config
      PRIVATE_REPO: ${{ inputs.private-repo || github.repository }}
      PRIVATE_REPO_RELEASE_BRANCH: ${{ inputs.private-repo-release-branch || 'release' }}

      PUBLIC_REPO: ${{ inputs.public-repo || 'SETT-Centre-Data-and-AI/workflows' }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ inputs.public-repo-release-branch || 'release' }}
      PUBLIC_REPO_INCOMING_BRANCH: ${{ inputs.public-repo-incoming-branch || 'incoming_from_private' }}

      MANAGEMENT_TOKEN: ${{ secrets.MANAGEMENT_TOKEN }}


    steps:
    - name: Check Sync Token
      run: |
        if [ -z "${MANAGEMENT_TOKEN}" ]; then
          echo "ERROR: MANAGEMENT_TOKEN is not set or empty"
          exit 1
        else
          echo "Management token is present"
        fi

    - name: Show Token Actor and Ruleset Diagnostics
      env:
        GH_TOKEN: ${{ env.MANAGEMENT_TOKEN }}
        PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        PUBLIC_REPO_INCOMING_BRANCH: ${{ env.PUBLIC_REPO_INCOMING_BRANCH }}
      run: |
        echo "Resolving token actor identity..."
        token_actor=$(gh api user --jq .login 2>/dev/null || echo "unknown")
        echo "Token actor: ${token_actor}"
        echo "Target repo:  ${PUBLIC_REPO}"
        echo "Target branch: ${PUBLIC_REPO_INCOMING_BRANCH}"

        echo "Effective rulesets for target branch:"
        gh api \
          "repos/${PUBLIC_REPO}/rules/branches/${PUBLIC_REPO_INCOMING_BRANCH}" \
          --jq '.[] | {name: .name, source: .source, enforcement: .enforcement, bypass_actors: (.bypass_actors // [])}' \
          || echo "Could not query branch rules via API (insufficient token permissions or endpoint not available)."

    - name: Checkout Private Release Branch
      uses: actions/checkout@v5
      with:
        ref: ${{ env.PRIVATE_REPO_RELEASE_BRANCH }}
        fetch-depth: 0
        persist-credentials: false

    - name: Configure Public Release Branch
      env:
        MANAGEMENT_TOKEN: ${{ env.MANAGEMENT_TOKEN }}
        PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        PUBLIC_REPO_INCOMING_BRANCH: ${{ env.PUBLIC_REPO_INCOMING_BRANCH }}
        PRIVATE_REPO_RELEASE_BRANCH: ${{ env.PRIVATE_REPO_RELEASE_BRANCH }}
      run: |
        # Remove potential GitHub Actions token override
        git config --unset-all http.https://github.com/.extraheader || true

        # Add remote
        git remote remove public 2>/dev/null || true
        git remote add public https://x-access-token:${MANAGEMENT_TOKEN}@github.com/${PUBLIC_REPO}.git

        echo "Checking if branch ${PUBLIC_REPO_INCOMING_BRANCH} exists on public..."
        branch_ref=$(git ls-remote --heads public "refs/heads/${PUBLIC_REPO_INCOMING_BRANCH}" || true)
        if [ -n "$branch_ref" ]; then
          echo "PUBLIC_BRANCH_EXISTS=true" >> "$GITHUB_ENV"
        else
          echo "PUBLIC_BRANCH_EXISTS=false" >> "$GITHUB_ENV"
        fi

        echo "Checking for existing open PR..."
        export GH_TOKEN="$MANAGEMENT_TOKEN"
        existing_pr=$(gh pr list \
          --repo "$PUBLIC_REPO" \
          --head "${PUBLIC_REPO_INCOMING_BRANCH}" \
          --base "${PUBLIC_REPO_RELEASE_BRANCH}" \
          --state open \
          --json number \
          --jq '.[0].number' || true)

        echo "EXISTING_PR=${existing_pr}" >> "$GITHUB_ENV"

    - name: Push Release Branch to Public
      env:
        MANAGEMENT_TOKEN: ${{ env.MANAGEMENT_TOKEN }}
        PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        PUBLIC_REPO_INCOMING_BRANCH: ${{ env.PUBLIC_REPO_INCOMING_BRANCH }}
      run: |
        git remote show public >/dev/null 2>&1 || \
          git remote add public https://x-access-token:${MANAGEMENT_TOKEN}@github.com/${PUBLIC_REPO}.git

        echo "Pushing HEAD → public:${PUBLIC_REPO_INCOMING_BRANCH}"
        set +e
        git push public HEAD:refs/heads/${PUBLIC_REPO_INCOMING_BRANCH}
        push_exit=$?
        set -e

        if [ "$push_exit" -eq 0 ]; then
          echo "Non-force push succeeded."
          exit 0
        fi

        echo "Non-force push failed. Trying force push as fallback..."
        set +e
        force_output=$(git push public HEAD:refs/heads/${PUBLIC_REPO_INCOMING_BRANCH} --force 2>&1)
        force_exit=$?
        set -e
        echo "$force_output"

        if [ "$force_exit" -eq 0 ]; then
          echo "Force push succeeded."
          exit 0
        fi

        if echo "$force_output" | grep -q "GH013"; then
          echo "ERROR: Push blocked by repository rules (GH013)."
          echo "The token actor must be explicitly listed in the target repo ruleset bypass list for branch ${PUBLIC_REPO_INCOMING_BRANCH}."
          echo "Also confirm bypass mode allows direct pushes (not PR-only) for this actor."
        fi

        exit "$force_exit"

    - name: Create PR for Release
      env:
        GH_TOKEN: ${{ env.MANAGEMENT_TOKEN }}
        PUBLIC_REPO: ${{ env.PUBLIC_REPO }}
        PUBLIC_REPO_INCOMING_BRANCH: ${{ env.PUBLIC_REPO_INCOMING_BRANCH }}
        PUBLIC_REPO_RELEASE_BRANCH: ${{ env.PUBLIC_REPO_RELEASE_BRANCH }}
      run: |
        if [ -n "${EXISTING_PR:-}" ]; then
          echo "PR #$EXISTING_PR already exists, skipping."
          exit 0
        fi

        gh pr create \
          --repo "$PUBLIC_REPO" \
          --head "${PUBLIC_REPO_INCOMING_BRANCH}" \
          --base "${PUBLIC_REPO_RELEASE_BRANCH}" \
          --title "Sync from private ${PRIVATE_REPO_RELEASE_BRANCH}" \
          --body "Automated sync from private release branch."
