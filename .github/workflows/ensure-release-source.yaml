name: Validate Release Source

# =================================================================== #
# Ensure Release PR Source Is Allowed
# Validates allowed source->target PR routes for release branches:
# - private: main -> release
# - public: incoming_from_private -> release
# =================================================================== #

on:
  workflow_call:
    inputs:
      private-repo:
        required: false
        type: string
      private-repo-main-branch:
        required: false
        type: string
      private-repo-release-branch:
        required: false
        type: string
      public-repo:
        required: false
        type: string
      public-repo-release-branch:
        required: false
        type: string
      public-repo-incoming-branch:
        required: false
        type: string

jobs:
  ensure-release-source:
    name: Validate Source
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      PRIVATE_REPO: ${{ inputs.private-repo }}
      PRIVATE_REPO_MAIN_BRANCH: ${{ inputs.private-repo-main-branch }}
      PRIVATE_REPO_RELEASE_BRANCH: ${{ inputs.private-repo-release-branch }}
      PUBLIC_REPO: ${{ inputs.public-repo }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ inputs.public-repo-release-branch }}
      PUBLIC_REPO_INCOMING_BRANCH: ${{ inputs.public-repo-incoming-branch }}

    steps:
    - name: Show PR Context
      run: |
        echo "Repo:            $GITHUB_REPOSITORY"
        echo "Base branch:     ${{ github.base_ref }}"
        echo "Head branch:     ${{ github.head_ref }}"
        echo "Private repo:    $PRIVATE_REPO"
        echo "Private main:    $PRIVATE_REPO_MAIN_BRANCH"
        echo "Private release: $PRIVATE_REPO_RELEASE_BRANCH"
        echo "Public repo:     $PUBLIC_REPO"
        echo "Public incoming: $PUBLIC_REPO_INCOMING_BRANCH"
        echo "Public release:  $PUBLIC_REPO_RELEASE_BRANCH"

    - name: Validate Allowed Source->Target Route
      run: |
        repo="$GITHUB_REPOSITORY"
        base="${{ github.base_ref }}"
        head="${{ github.head_ref }}"

        if [ "$repo" = "$PUBLIC_REPO" ] && [ "$base" = "$PUBLIC_REPO_RELEASE_BRANCH" ]; then
          if [ "$head" != "$PUBLIC_REPO_INCOMING_BRANCH" ]; then
            echo "ERROR: PRs into '$PUBLIC_REPO_RELEASE_BRANCH' must come from '$PUBLIC_REPO_INCOMING_BRANCH'."
            echo "Actual source branch: '$head'"
            exit 1
          fi
          echo "Public release route allowed: $head -> $base"
          exit 0
        fi

        if [ "$repo" = "$PRIVATE_REPO" ] && [ "$base" = "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
          if [ "$head" != "$PRIVATE_REPO_MAIN_BRANCH" ]; then
            echo "ERROR: PRs into '$PRIVATE_REPO_RELEASE_BRANCH' must come from '$PRIVATE_REPO_MAIN_BRANCH'."
            echo "Actual source branch: '$head'"
            exit 1
          fi
          echo "Private release route allowed: $head -> $base"
          exit 0
        fi

        echo "No release-route validation required for this PR context."
