name: CI Router

# =================================================================== #
# Workflow Orchestrator
# Central place to route events and dispatch downstream reusable workflows.
# =================================================================== #

on:
  workflow_call:
    inputs:
      event-name:
        required: false
        type: string
      event-action:
        required: false
        type: string
      base-ref:
        required: false
        type: string
      head-ref:
        required: false
        type: string
      ref-name:
        required: false
        type: string
      repository:
        required: false
        type: string
      pr-merged:
        required: false
        type: boolean
      package-name:
        required: false
        type: string
      package-slug:
        required: false
        type: string
      private-repo:
        required: false
        type: string
      private-repo-main-branch:
        required: false
        type: string
      private-repo-release-branch:
        required: false
        type: string
      private-repo-incoming-branch:
        required: false
        type: string
      public-repo:
        required: false
        type: string
      public-repo-release-branch:
        required: false
        type: string
      public-repo-incoming-branch:
        required: false
        type: string
      build-smoke-python-version:
        required: false
        type: string
      test-matrix-json:
        required: false
        type: string
      version-check-python-version:
        required: false
        type: string
      publish-python-version:
        required: false
        type: string
      publish-on-release:
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  env-config:
    name: Resolve Config
    uses: ./.github/workflows/config.yaml
    with:
      package-name: ${{ inputs.package-name }}
      package-slug: ${{ inputs.package-slug }}
      private-repo: ${{ inputs.private-repo }}
      private-repo-main-branch: ${{ inputs.private-repo-main-branch }}
      private-repo-release-branch: ${{ inputs.private-repo-release-branch }}
      private-repo-incoming-branch: ${{ inputs.private-repo-incoming-branch }}
      public-repo: ${{ inputs.public-repo }}
      public-repo-release-branch: ${{ inputs.public-repo-release-branch }}
      public-repo-incoming-branch: ${{ inputs.public-repo-incoming-branch }}
      build-smoke-python-version: ${{ inputs.build-smoke-python-version }}
      test-matrix-json: ${{ inputs.test-matrix-json }}
      version-check-python-version: ${{ inputs.version-check-python-version }}
      publish-python-version: ${{ inputs.publish-python-version }}
      publish-on-release: ${{ inputs.publish-on-release }}

  route:
    name: Route
    needs: env-config
    runs-on: ubuntu-latest
    outputs:
      RUN_BUILD_AND_TEST: ${{ steps.route.outputs.RUN_BUILD_AND_TEST }}
      RUN_ENSURE_RELEASE_SOURCE: ${{ steps.route.outputs.RUN_ENSURE_RELEASE_SOURCE }}
      RUN_PRE_RELEASE_VERSION_CHECK: ${{ steps.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK }}
      RUN_BACK_SYNC: ${{ steps.route.outputs.RUN_BACK_SYNC }}
      RUN_SYNC_TO_PUBLIC: ${{ steps.route.outputs.RUN_SYNC_TO_PUBLIC }}
      RUN_PUBLISH_TO_PYPI: ${{ steps.route.outputs.RUN_PUBLISH_TO_PYPI }}

    defaults:
      run:
        shell: bash

    env:
      PRIVATE_REPO: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      PRIVATE_REPO_MAIN_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      PRIVATE_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
      PUBLIC_REPO: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      PUBLIC_REPO_RELEASE_BRANCH: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      PUBLIC_REPO_INCOMING_BRANCH: ${{ needs.env-config.outputs.PUBLIC_REPO_INCOMING_BRANCH }}
      PUBLISH_ON_RELEASE: ${{ needs.env-config.outputs.PUBLISH_ON_RELEASE }}
      CALLER_EVENT_NAME: ${{ inputs.event-name }}
      CALLER_EVENT_ACTION: ${{ inputs.event-action }}
      CALLER_BASE_REF: ${{ inputs.base-ref }}
      CALLER_HEAD_REF: ${{ inputs.head-ref }}
      CALLER_REF_NAME: ${{ inputs.ref-name }}
      CALLER_REPOSITORY: ${{ inputs.repository }}
      CALLER_PR_MERGED: ${{ inputs.pr-merged }}
      CTX_EVENT_ACTION: ${{ github.event.action || '' }}
      CTX_BASE_REF: ${{ github.base_ref || '' }}
      CTX_HEAD_REF: ${{ github.head_ref || '' }}
      CTX_REF_NAME: ${{ github.ref_name || '' }}
      CTX_PR_MERGED: ${{ github.event.pull_request.merged || false }}
      WORKFLOW_REF: ${{ github.workflow_ref || '' }}

    steps:
    - name: Show Event Context
      run: |
        EVENT_NAME="${CALLER_EVENT_NAME:-$GITHUB_EVENT_NAME}"
        EVENT_ACTION="${CALLER_EVENT_ACTION:-$CTX_EVENT_ACTION}"
        BASE_REF="${CALLER_BASE_REF:-$CTX_BASE_REF}"
        HEAD_REF="${CALLER_HEAD_REF:-$CTX_HEAD_REF}"
        REF_NAME="${CALLER_REF_NAME:-$CTX_REF_NAME}"
        REPOSITORY_NAME="${CALLER_REPOSITORY:-$GITHUB_REPOSITORY}"
        PR_MERGED="${CALLER_PR_MERGED:-$CTX_PR_MERGED}"

        echo "Repo:        $GITHUB_REPOSITORY"
        echo "Event:       $GITHUB_EVENT_NAME"
        echo "Action:      ${{ github.event.action || 'n/a' }}"
        echo "Ref:         $GITHUB_REF"
        echo "Ref name:    $GITHUB_REF_NAME"
        echo "Base ref:    ${{ github.base_ref || 'n/a' }}"
        echo "Head ref:    ${{ github.head_ref || 'n/a' }}"
        echo "Effective repo:      $REPOSITORY_NAME"
        echo "Effective event:     $EVENT_NAME"
        echo "Effective action:    ${EVENT_ACTION:-n/a}"
        echo "Effective base ref:  ${BASE_REF:-n/a}"
        echo "Effective head ref:  ${HEAD_REF:-n/a}"
        echo "Effective ref name:  ${REF_NAME:-n/a}"
        echo "Effective merged:    ${PR_MERGED:-false}"

    - name: Compute Routed Workflows
      id: route
      run: |
        EVENT_NAME="${CALLER_EVENT_NAME:-$GITHUB_EVENT_NAME}"
        EVENT_ACTION="${CALLER_EVENT_ACTION:-$CTX_EVENT_ACTION}"
        BASE_REF="${CALLER_BASE_REF:-$CTX_BASE_REF}"
        HEAD_REF="${CALLER_HEAD_REF:-$CTX_HEAD_REF}"
        REF_NAME="${CALLER_REF_NAME:-$CTX_REF_NAME}"
        REPOSITORY_NAME="${CALLER_REPOSITORY:-$GITHUB_REPOSITORY}"
        PR_MERGED="${CALLER_PR_MERGED:-$CTX_PR_MERGED}"

        if [ "$REPOSITORY_NAME" = "SETT-Centre-Data-and-AI/workflows" ] || [ "$REPOSITORY_NAME" = "SETT-Centre-Data-and-AI/workflows_development" ]; then
          if [ -n "$WORKFLOW_REF" ] && [[ "$WORKFLOW_REF" == *"@release" ]]; then
            echo "ERROR: Internal workflow repositories must call their local entry workflow."
            echo "Internal repos must use local paths: uses: ./.github/workflows/<entrypoint>.yaml"
            echo "Not: uses: SETT-Centre-Data-and-AI/workflows/.github/workflows/<workflow>.yaml@release"
            echo "Actual workflow_ref: $WORKFLOW_REF"
            exit 1
          fi
        fi

        RUN_BUILD_AND_TEST=false
        RUN_ENSURE_RELEASE_SOURCE=false
        RUN_PRE_RELEASE_VERSION_CHECK=false
        RUN_BACK_SYNC=false
        RUN_SYNC_TO_PUBLIC=false
        RUN_PUBLISH_TO_PYPI=false

        if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$REF_NAME" = "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
            RUN_BACK_SYNC=true
            if [ -n "$PUBLIC_REPO" ] && [ "$PUBLIC_REPO" != "$PRIVATE_REPO" ]; then
              RUN_SYNC_TO_PUBLIC=true
            fi
          fi
          if [ "$REPOSITORY_NAME" = "$PUBLIC_REPO" ] && [ "$REF_NAME" = "$PUBLIC_REPO_RELEASE_BRANCH" ] && [ "$PUBLISH_ON_RELEASE" = "true" ]; then
            RUN_PUBLISH_TO_PYPI=true
          fi
        fi

        if [ "$EVENT_NAME" = "pull_request" ]; then
          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$BASE_REF" = "$PRIVATE_REPO_MAIN_BRANCH" ]; then
            if ([ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]) && [ "$HEAD_REF" != "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
              RUN_BUILD_AND_TEST=true
            fi
          fi

          if [ "$REPOSITORY_NAME" = "$PRIVATE_REPO" ] && [ "$BASE_REF" = "$PRIVATE_REPO_RELEASE_BRANCH" ]; then
            if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]; then
              RUN_ENSURE_RELEASE_SOURCE=true
              RUN_PRE_RELEASE_VERSION_CHECK=true
            fi

            if [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ] && [ "$HEAD_REF" = "$PRIVATE_REPO_MAIN_BRANCH" ]; then
              RUN_BACK_SYNC=true
              if [ -n "$PUBLIC_REPO" ] && [ "$PUBLIC_REPO" != "$PRIVATE_REPO" ]; then
                RUN_SYNC_TO_PUBLIC=true
              fi
            fi
          fi

          if [ "$REPOSITORY_NAME" = "$PUBLIC_REPO" ] && [ "$BASE_REF" = "$PUBLIC_REPO_RELEASE_BRANCH" ]; then
            if [ "$EVENT_ACTION" = "opened" ] || [ "$EVENT_ACTION" = "reopened" ] || [ "$EVENT_ACTION" = "synchronize" ]; then
              RUN_ENSURE_RELEASE_SOURCE=true
              RUN_PRE_RELEASE_VERSION_CHECK=true
            fi

            if [ "$EVENT_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ] && [ "$HEAD_REF" = "$PUBLIC_REPO_INCOMING_BRANCH" ] && [ "$PUBLISH_ON_RELEASE" = "true" ]; then
              RUN_PUBLISH_TO_PYPI=true
            fi
          fi
        fi

        echo "RUN_BUILD_AND_TEST=$RUN_BUILD_AND_TEST" >> "$GITHUB_OUTPUT"
        echo "RUN_ENSURE_RELEASE_SOURCE=$RUN_ENSURE_RELEASE_SOURCE" >> "$GITHUB_OUTPUT"
        echo "RUN_PRE_RELEASE_VERSION_CHECK=$RUN_PRE_RELEASE_VERSION_CHECK" >> "$GITHUB_OUTPUT"
        echo "RUN_BACK_SYNC=$RUN_BACK_SYNC" >> "$GITHUB_OUTPUT"
        echo "RUN_SYNC_TO_PUBLIC=$RUN_SYNC_TO_PUBLIC" >> "$GITHUB_OUTPUT"
        echo "RUN_PUBLISH_TO_PYPI=$RUN_PUBLISH_TO_PYPI" >> "$GITHUB_OUTPUT"

    - name: Show Routed Workflow Map
      run: |
        echo "Routed workflows for this event:"
        echo "  build-and-test:                       ${{ steps.route.outputs.RUN_BUILD_AND_TEST }}"
        echo "  ensure-release-source:                ${{ steps.route.outputs.RUN_ENSURE_RELEASE_SOURCE }}"
        echo "  pre-release-version-check:            ${{ steps.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK }}"
        echo "  back-sync-release-to-main:            ${{ steps.route.outputs.RUN_BACK_SYNC }}"
        echo "  sync-to-public:                       ${{ steps.route.outputs.RUN_SYNC_TO_PUBLIC }}"
        echo "  publish-to-pypi:                      ${{ steps.route.outputs.RUN_PUBLISH_TO_PYPI }}"

  run-build-and-test:
    name: Build and Test
    needs: [env-config, route]
    if: needs.route.outputs.RUN_BUILD_AND_TEST == 'true'
    uses: ./.github/workflows/build-and-test.yaml
    with:
      package-name: ${{ needs.env-config.outputs.PACKAGE_NAME }}
      package-slug: ${{ needs.env-config.outputs.PACKAGE_SLUG }}
      private-repo: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      private-repo-main-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      private-repo-release-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
      private-repo-incoming-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_INCOMING_BRANCH }}
      public-repo: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      public-repo-release-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      public-repo-incoming-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_INCOMING_BRANCH }}
      build-smoke-python-version: ${{ needs.env-config.outputs.BUILD_SMOKE_PYTHON_VERSION }}
      test-matrix-json: ${{ needs.env-config.outputs.TEST_MATRIX_JSON }}
      version-check-python-version: ${{ needs.env-config.outputs.VERSION_CHECK_PYTHON_VERSION }}
      publish-python-version: ${{ needs.env-config.outputs.PUBLISH_PYTHON_VERSION }}
      publish-on-release: ${{ needs.env-config.outputs.PUBLISH_ON_RELEASE }}

  run-ensure-release-source:
    name: Validate Source
    needs: [env-config, route]
    if: needs.route.outputs.RUN_ENSURE_RELEASE_SOURCE == 'true'
    uses: ./.github/workflows/ensure-release-source.yaml
    with:
      private-repo: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      private-repo-main-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      private-repo-release-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
      public-repo: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      public-repo-release-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      public-repo-incoming-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_INCOMING_BRANCH }}

  run-pre-release-version-check:
    name: Check Version
    needs: [env-config, route]
    if: needs.route.outputs.RUN_PRE_RELEASE_VERSION_CHECK == 'true'
    uses: ./.github/workflows/pre-release-version-check.yaml
    with:
      version-check-python-version: ${{ needs.env-config.outputs.VERSION_CHECK_PYTHON_VERSION }}

  run-back-sync-release-to-main:
    name: Back Sync
    needs: [env-config, route]
    if: needs.route.outputs.RUN_BACK_SYNC == 'true'
    uses: ./.github/workflows/back-sync-release-to-main.yaml
    with:
      private-repo: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      private-repo-main-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_MAIN_BRANCH }}
      private-repo-release-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
    secrets: inherit

  run-sync-to-public:
    name: Sync Public
    needs: [env-config, route]
    if: needs.route.outputs.RUN_SYNC_TO_PUBLIC == 'true'
    uses: ./.github/workflows/sync-to-public.yaml
    with:
      private-repo: ${{ needs.env-config.outputs.PRIVATE_REPO }}
      private-repo-release-branch: ${{ needs.env-config.outputs.PRIVATE_REPO_RELEASE_BRANCH }}
      public-repo: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      public-repo-release-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      public-repo-incoming-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_INCOMING_BRANCH }}
    secrets: inherit

  run-publish-to-pypi:
    name: Publish
    needs: [env-config, route]
    if: needs.route.outputs.RUN_PUBLISH_TO_PYPI == 'true'
    uses: ./.github/workflows/publish-to-pypi.yaml
    with:
      package-name: ${{ needs.env-config.outputs.PACKAGE_NAME }}
      package-slug: ${{ needs.env-config.outputs.PACKAGE_SLUG }}
      public-repo: ${{ needs.env-config.outputs.PUBLIC_REPO }}
      public-repo-release-branch: ${{ needs.env-config.outputs.PUBLIC_REPO_RELEASE_BRANCH }}
      publish-python-version: ${{ needs.env-config.outputs.PUBLISH_PYTHON_VERSION }}
      publish-on-release: ${{ needs.env-config.outputs.PUBLISH_ON_RELEASE }}
    secrets: inherit
